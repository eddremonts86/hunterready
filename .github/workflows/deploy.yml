name: Deploy to Coolify

# Only after Quality has gone green on master. Never on the push itself: a deploy that races its own
# test run is a deploy that can ship red code.
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# Serialised, and deliberately *not* cancel-in-progress. Cancelling a half-finished container swap is
# worse than queueing behind it.
concurrency:
  group: coolify-deploy
  cancel-in-progress: false

env:
  # The application's name in Coolify, and the host it is expected to answer on. Both are asserted
  # against the live API before anything is deployed — see the resolve step.
  COOLIFY_APP_NAME: hunterready

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deploy is configured before touching anything
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -uo pipefail
          missing=()
          [ -z "${COOLIFY_API_URL}" ]   && missing+=(COOLIFY_API_URL)
          [ -z "${COOLIFY_API_TOKEN}" ] && missing+=(COOLIFY_API_TOKEN)
          [ -z "${PRODUCTION_URL}" ]    && missing+=(PRODUCTION_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not configured for deploys yet. Missing: ${missing[*]}. See docs/operations/deploy-runbook.md"
            exit 1
          fi

      # Resolved by name from the live API, every run — never read from a stored UUID.
      #
      # The Coolify server hosts a dozen applications and a saved `COOLIFY_APP_UUID` belongs to
      # whichever app was provisioned when it was written. Deploying the wrong uuid restarts somebody
      # else's production app, and **Coolify reports success**. There is no error to notice.
      #
      # So: match on name, then assert the app's own `fqdn` is the host we expect. Two independent
      # facts have to agree before a deploy is triggered.
      - name: Resolve the application by name, and verify it is the right one
        id: resolve
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -uo pipefail
          apps=$(curl -fsS -m 30 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_API_URL}/api/v1/applications") || {
              echo "::error::could not list Coolify applications — check COOLIFY_API_URL and that the token is still valid (a rotated token answers 401 Unauthenticated)"
              exit 1
            }

          uuid=$(printf '%s' "$apps" | APP_NAME="${COOLIFY_APP_NAME}" EXPECTED="${PRODUCTION_URL}" node -e '
            let d = ""
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              const apps = JSON.parse(d)
              const wanted = process.env.APP_NAME
              const matches = apps.filter((a) => a.name === wanted)
              if (matches.length === 0) {
                console.error(`::error::no Coolify application named "${wanted}". Present: ${apps.map((a) => a.name).join(", ")}`)
                process.exit(1)
              }
              if (matches.length > 1) {
                console.error(`::error::${matches.length} applications named "${wanted}" — refusing to guess which one to deploy`)
                process.exit(1)
              }
              const app = matches[0]
              // The second, independent fact. A name collision across environments is exactly how the
              // wrong app gets deployed, and the fqdn is what a user would actually visit.
              const host = (url) => String(url || "").replace(/^https?:\/\//, "").replace(/\/.*$/, "")
              if (host(app.fqdn) !== host(process.env.EXPECTED)) {
                console.error(`::error::"${wanted}" answers on ${app.fqdn}, but PRODUCTION_URL is ${process.env.EXPECTED} — one of the two is wrong, so nothing was deployed`)
                process.exit(1)
              }
              process.stdout.write(app.uuid)
            })
          ')
          echo "app_uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "Resolved $COOLIFY_APP_NAME to an application whose fqdn matches PRODUCTION_URL."

      - name: Trigger deployment
        id: trigger
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail
          resp=$(curl -fsS -X POST -m 30 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_API_URL}/api/v1/applications/${{ steps.resolve.outputs.app_uuid }}/start")
          uuid=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).deployment_uuid||"")}catch{process.stdout.write("")}})')
          if [ -z "$uuid" ]; then
            echo "::error::Coolify accepted the request but returned no deployment_uuid"
            exit 1
          fi
          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail
          uuid="${{ steps.trigger.outputs.deployment_uuid }}"
          for i in $(seq 1 60); do
            sleep 10
            resp=$(curl -fsS -m 30 -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL}/api/v1/deployments/$uuid") || continue
            dstatus=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).status||"?")}catch{process.stdout.write("?")}})')
            echo "poll $i: $dstatus"
            case "$dstatus" in
              finished|success) exit 0 ;;
              failed|error|cancelled) echo "::error::Deployment $dstatus"; exit 1 ;;
            esac
          done
          echo "::error::timeout waiting for the Coolify deployment"; exit 1

      # Coolify saying "finished" means the container started. That is not the same claim as "the app
      # works", and this project's one production incident lives in the gap between them: `vite build`
      # exited 0, the container started clean, and every render 500'd because Rollup had never emitted
      # the renderer's WASM. Nothing in the pipeline was red.
      #
      # So the health payload is asserted field by field rather than by status code. `/api/health`
      # reports `wasm` and `fonts` precisely because those are the two things that can be absent from
      # a "successful" build, and a deploy that does not check them is a deploy a user reports to you.
      #
      # Deliberately no `-L`. A domain parked on URL forwarding answers 302 on every path and lands on
      # a 200 homepage, which would read as health — the same failure, one level more subtle.
      - name: Verify production actually renders
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          set -uo pipefail

          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "poll $i: /api/health -> $code"
            [ "$i" = 30 ] && { echo "::error::$BASE/api/health never returned 200 after the deploy"; exit 1; }
            sleep 5
          done

          body=$(curl -sS --max-time 10 "$BASE/api/health" || echo '')
          echo "health: $body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *) echo "::error::200 but not the health payload — a proxy or error page answered: $body"; exit 1 ;;
          esac
          # The two things a green build can still get wrong.
          case "$body" in
            *'"wasm":true'*) ;;
            *) echo "::error::the PDF renderer's WASM is missing from the image — every export would 500"; exit 1 ;;
          esac
          case "$body" in
            *'"fonts":true'*) ;;
            *) echo "::error::the bundled fonts are missing from the image — renders would fall back or fail"; exit 1 ;;
          esac

          page=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || echo 000)
          if [ "$page" != "200" ]; then
            echo "::error::$BASE/ returned $page — the process is up but not serving the app"
            exit 1
          fi

          echo "✅ Deployed and verified: $BASE (health ok, wasm ok, fonts ok, landing 200)" >> "$GITHUB_STEP_SUMMARY"
